<script>
window.addEventListener('error', function(e) {
  var el = document.getElementById('err');
  if (el) { el.style.display = 'block'; el.textContent = 'ERREUR: ' + e.message; }
});

var KEY = 'mdpc_v100';
var state = { currentUser: null, users: {} };
try { var raw = localStorage.getItem(KEY); if (raw) state = JSON.parse(raw); } catch (e) {}

function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} header(); }
function user() { return state.currentUser ? state.users[state.currentUser] : null; }
function mkUser(n) { return { name: n, done: {}, certs: [], examens: {}, jours: {}, created: new Date().toISOString().slice(0,10) }; }
function today() { return new Date().toISOString().slice(0,10); }

function countDone(lvl) {
  var u = user(); if (!u) return 0;
  var c = 0, p = lvl + '_';
  for (var k in u.done) { if (k.indexOf(p) === 0 && u.done[k]) c++; }
  return c;
}
function isComplete(lvl) { return countDone(lvl) >= 10; }
function isUnlocked(lvl) { if (lvl === 1) return true; return isComplete(lvl - 1); }

function simulate() {
  var u = user(); if (!u) return;
  for (var i = 1; i <= 10; i++) {
    u.done['1_'+i]=true; u.done['2_'+i]=true; u.done['3_'+i]=true;
    u.done['4_'+i]=true; u.done['5_'+i]=true; u.done['6_'+i]=true;
    u.done['7_'+i]=true; u.done['8_'+i]=true; u.done['9_'+i]=true;
  }
  save();
  alert('N1-N9 simulés. Niveau 10 débloqué !');
  route();
}

function login() {
  var el = document.getElementById('loginName'); if (!el) return;
  var n = el.value.trim(); if (!n) { alert('Entre ton prénom'); return; }
  var k = n.toLowerCase().replace(/\s+/g, '_');
  if (!state.users[k]) state.users[k] = mkUser(n);
  state.currentUser = k; save(); go('home');
}
function logout() { state.currentUser = null; save(); go('login'); }
function go(h) { location.hash = h; }

var DEFIS = [
{id:1, titre:"Le secteur bancaire ivoirien", intro:"Comprendre l écosystème bancaire ivoirien est la base de toute carrière cyber en banque. Acteurs, régulateurs, enjeux.",
cours:"<h3>Le paysage bancaire ivoirien</h3><p>La Côte d Ivoire est le <strong>premier hub financier</strong> de l UEMOA (Union Économique et Monétaire Ouest-Africaine). Plus de 25 banques y opèrent.</p><h3>Banques principales</h3><table><tr><th>Banque</th><th>Type</th><th>Particularité</th></tr><tr><td>SGCI</td><td>Privée</td><td>Filiale Société Générale</td></tr><tr><td>BNI</td><td>Publique</td><td>Banque Nationale d Investissement</td></tr><tr><td>Ecobank CI</td><td>Privée</td><td>Groupe panafricain</td></tr><tr><td>SIB</td><td>Privée</td><td>Société Ivoirienne de Banque</td></tr><tr><td>NSIA Banque</td><td>Privée</td><td>Groupe NSIA</td></tr><tr><td>Orabank</td><td>Privée</td><td>Groupe Orabank</td></tr><tr><td>Coris Bank</td><td>Privée</td><td>Groupe burkinabè</td></tr><tr><td>BOA CI</td><td>Privée</td><td>Bank of Africa</td></tr><tr><td>Atlantic Business International</td><td>Privée</td><td>ABI</td></tr><tr><td>Banque Atlantique</td><td>Privée</td><td>Groupe ABI</td></tr></table><h3>Les régulateurs</h3><ul><li><strong>BCEAO</strong> — Banque Centrale des États de l Afrique de l Ouest (siège à Dakar)</li><li><strong>CB-UMOA</strong> — Commission Bancaire de l UMOA</li><li><strong>ARTCI</strong> — Autorité de Régulation des Télécoms et TIC</li><li><strong>PLCC</strong> — Plateforme de Lutte contre la Cybercriminalité</li><li><strong>CEPICI</strong> — Centre de Promotion des Investissements</li></ul><h3>Les acteurs IT</h3><ul><li><strong>GIM-UEMOA</strong> — interbancaire monétique</li><li><strong>SICA</strong> — Société Interbancaire de Compensation Automatisée</li><li><strong>SWIFT</strong> — réseau international</li><li><strong>Visa / Mastercard</strong> — réseaux cartes</li></ul><h3>Métiers IT en banque</h3><ul><li>DSI — Direction des Systèmes d Information</li><li>RSSI — Responsable Sécurité SI</li><li>SOC — Security Operations Center</li><li>Audit interne SI</li><li>Conformité / Risk Management</li></ul><div class=\"box\">Une banque = un coffre-fort qui brasse de l argent numérique. Chaque poste IT est un maillon critique.</div><div class=\"bank\">Le secteur bancaire CI embauche massivement en cyber (audit, SOC, conformité). C est un débouché direct après ce parcours.</div><div class=\"warn\">Une panne de la BCEAO peut bloquer tout le système bancaire national. Les cyberattaques visent souvent l infrastructure interbancaire.</div>",
cas:"<h3>Cas 1 — Cartographier une banque</h3><p>Structurer la DSI d une banque type :</p><ul><li>Direction (CIO, RSSI)</li><li>Infrastructure (réseau, serveurs)</li><li>Applications (core banking, paiement)</li><li>Sécurité (SOC, IAM)</li><li>Support (helpdesk)</li><li>Projets</li></ul><h3>Cas 2 — Choisir une cible</h3><p>Étudiant L2 UVCI : viser un stage en SOC, audit interne, conformité, ou infrastructure.</p><p>Compétences demandées : réseaux, Linux, sécurité, réglementation.</p><h3>Cas 3 — Le rôle du RSSI</h3><ul><li>Définir la politique SSI</li><li>Veiller à la conformité (BCEAO, PCI-DSS)</li><li>Piloter les audits</li><li>Gérer les incidents</li><li>Sensibiliser les utilisateurs</li></ul>",
quiz:[
{q:'Régulateur bancaire ?',o:['BCEAO','Google','Microsoft','Amazon'],c:0,e:'BCEAO.'},
{q:'RSSI = ?',o:['Responsable Sécurité SI','Routeur','Antivirus','Firewall'],c:0,e:'Sécurité SI.'}
]},

{id:2, titre:"Réglementation BCEAO et cybersécurité", intro:"La BCEAO impose des règles strictes aux banques. Ignorer ces règles = sanctions, retrait de licence.",
cours:"<h3>Qui est la BCEAO</h3><p>La <strong>BCEAO</strong> est la banque centrale des 8 pays de l UEMOA (Bénin, Burkina, Côte d Ivoire, Guinée-Bissau, Mali, Niger, Sénégal, Togo). Elle régule les banques et impose des règles de sécurité.</p><h3>Textes majeurs</h3><ul><li><strong>Instruction 008-2018</strong> — établissements de paiement</li><li><strong>Directive 02-2016</strong> — monnaie électronique</li><li><strong>Instruction 006-2019</strong> — sécurité des SI</li><li><strong>Directive 01-2018</strong> — lutte anti-blanchiment</li><li><strong>Règlement 09-2010</strong> — systèmes de paiement</li></ul><h3>Exigences cybersécurité BCEAO</h3><ul><li><strong>Gouvernance</strong> — RSSI indépendant, comité sécurité</li><li><strong>Audit</strong> — annuel obligatoire, par prestataire agréé</li><li><strong>Chiffrement</strong> — données sensibles en transit et au repos</li><li><strong>Continuité</strong> — PCA testé annuellement</li><li><strong>Incidents</strong> — notification sous 72h</li><li><strong>Formation</strong> — sensibilisation annuelle</li><li><strong>Localisation</strong> — données critiques au sein de l UMOA (ou pays équivalent)</li></ul><h3>Sanctions possibles</h3><ul><li>Avertissement</li><li>Blâme</li><li>Amende (jusqu à % du capital)</li><li>Suspension d activité</li><li>Retrait d agrément</li></ul><h3>Autorités complémentaires</h3><ul><li><strong>GABAC</strong> — Groupe d Action contre le Blanchiment en Afrique Centrale</li><li><strong>GIABA</strong> — Groupe Intergouvernemental d Action contre le Blanchiment (Afrique de l Ouest)</li><li><strong>GAFI</strong> — Financial Action Task Force (international)</li></ul><div class=\"box\">La BCEAO est le « régulateur » du jeu bancaire. Sans son feu vert, aucune banque ne peut opérer.</div><div class=\"bank\">Toute cyberattaque majeure doit être notifiée à la BCEAO sous 72h. Un audit annuel est obligatoire.</div><div class=\"warn\">Une banque non conforme peut perdre sa licence. Le RSSI et le DG sont pénalement responsables.</div>",
cas:"<h3>Cas 1 — Notification d incident</h3><p>Délai : 72h max. Contenu :</p><ol><li>Nature de l incident</li><li>Données/systèmes affectés</li><li>Impact estimé</li><li>Mesures prises</li><li>Plan de remédiation</li><li>Contact RSSI</li></ol><h3>Cas 2 — Audit annuel</h3><ul><li>Périmètre : SI critique, applications bancaires, réseau, IAM</li><li>Référentiels : BCEAO, ISO 27001, PCI-DSS</li><li>Prestataire : cabinet agréé</li><li>Livrables : rapport + plan d action</li><li>Suivi : comité trimestriel</li></ul><h3>Cas 3 — Localisation des données</h3><p>La BCEAO exige que les données critiques (transactions, soldes) restent dans l UMOA ou pays équivalent. Les clouds étrangers (AWS US) sont interdits pour ces données.</p>",
quiz:[
{q:'Délai notification incident ?',o:['72h','1 mois','1 an','Aucun'],c:0,e:'72h.'},
{q:'Audit BCEAO ?',o:['Annuel','Jamais','5 ans','Mensuel'],c:0,e:'Annuel.'}
]},

{id:3, titre:"PCI-DSS — Sécurité des cartes bancaires", intro:"PCI-DSS est LE standard mondial pour la sécurité des données de carte. Toute banque ou commerçant qui accepte les cartes doit le respecter.",
cours:"<h3>Qui est concerné</h3><p><strong>PCI-DSS</strong> (Payment Card Industry Data Security Standard) s applique à quiconque stocke, traite ou transmet des données de carte bancaire.</p><ul><li>Banques</li><li>Commerçants (boutiques, e-commerce)</li><li>Prestataires de paiement</li><li>Processeurs de transaction</li></ul><h3>Les 12 exigences</h3><ol><li>Pare-feu et routeur sécurisés</li><li>Pas de mots de passe par défaut</li><li>Protection des données stockées (chiffrement)</li><li>Chiffrement des transmissions</li><li>Antivirus et anti-malware</li><li>Systèmes et applications sécurisés</li><li>Restriction d accès aux données (besoin d en connaître)</li><li>Authentification unique par utilisateur</li><li>Restriction d accès physique</li><li>Traçabilité des accès (logs)</li><li>Tests de sécurité réguliers</li><li>Politique de sécurité documentée</li></ol><h3>Ce qu on ne doit JAMAIS stocker</h3><ul><li><strong>CVV/CVC</strong> (code au dos)</li><li><strong>PIN</strong> (code de la carte)</li><li><strong>Piste magnétique complète</strong></li></ul><h3>Ce qu on peut stocker</h3><ul><li>PAN (numéro de carte) — chiffré</li><li>Nom du porteur</li><li>Date d expiration</li><li>Service Code</li></ul><h3>Niveaux PCI</h3><table><tr><th>Niveau</th><th>Transactions/an</th></tr><tr><td>1</td><td>&gt; 6 millions</td></tr><tr><td>2</td><td>1-6 millions</td></tr><tr><td>3</td><td>20 000 - 1 million (e-commerce)</li><tr><td>4</td><td>&lt; 20 000</td></tr></table><h3>Audit</h3><ul><li>Niveau 1 : audit par QSA (Qualified Security Assessor)</li><li>Niveaux 2-4 : auto-évaluation (SAQ) + scan ASV</li></ul><div class=\"box\">PCI-DSS = le code de la route des paiements par carte. Sans respect = exclusion du système bancaire.</div><div class=\"bank\">Toutes les banques ivoiriennes traitant Visa/Mastercard sont PCI-DSS niveau 1 ou 2.</div><div class=\"warn\">Stocker un CVV = violation PCI critique. Amende possible de plusieurs millions de FCFA par mois de non-conformité.</div>",
cas:"<h3>Cas 1 — Périmètre PCI</h3><p>Tout système qui touche des données de carte fait partie du CDE (Cardholder Data Environment) :</p><ul><li>Serveur web e-commerce</li><li>Base de données</li><li>Réseau entre eux</li><li>Postes des admins</li><li>Sauvegardes</li></ul><h3>Cas 2 — Audit SAQ</h3><p>Questionnaire d auto-évaluation. Questions clés :</p><ul><li>Chiffrement des PAN ? (AES-256)</li><li>CVV non stocké ?</li><li>TLS 1.2+ ?</li><li>Logs 1 an ?</li><li>Scan ASV trimestriel ?</li></ul><h3>Cas 3 — Tokenisation</h3><p>Remplacer le PAN par un token (ex : VISA-TOKEN-12345). Le token est inutilisable en dehors du système. Réduit le périmètre PCI.</p>",
quiz:[
{q:'Stocker CVV ?',o:['Autorisé','Interdit','Parfois','Recommandé'],c:1,e:'Interdit.'},
{q:'Niveau PCI banque importante ?',o:['1','4','Aucun','Facultatif'],c:0,e:'Niveau 1.'}
]},

{id:4, titre:"Loi ivoirienne — Protection des données (Loi 2013-450)", intro:"La Côte d Ivoire s est dotée d une loi robuste sur la protection des données. Ignorer cette loi = sanctions + atteinte à la réputation.",
cours:"<h3>Loi 2013-450</h3><p>Adoptée en 2013, la loi ivoirienne sur la protection des données personnelles est alignée sur le RGPD européen. Elle est appliquée par l <strong>ARTCI</strong>.</p><h3>Champ d application</h3><ul><li>Données personnelles (nom, adresse, email, téléphone)</li><li>Données sensibles (santé, religion, données bancaires, biométrie)</li><li>Données traitées manuellement ou par ordinateur</li><li>Quiconque traite des données en Côte d Ivoire</li></ul><h3>Obligations</h3><ul><li><strong>Déclaration préalable</strong> à l ARTCI</li><li><strong>Consentement</strong> de la personne concernée</li><li><strong>Finalité</strong> — usage défini et légitime</li><li><strong>Proportionnalité</strong> — collecter le minimum</li><li><strong>Durée limitée</strong> — conserver pas plus que nécessaire</li><li><strong>Sécurité</strong> — chiffrement, contrôle d accès</li><li><strong>Droits</strong> — accès, rectification, suppression, opposition</li><li><strong>Notification</strong> d une fuite à l ARTCI (72h)</li></ul><h3>Sanctions</h3><ul><li>Avertissement</li><li>Mise en demeure</li><li>Amende (jusqu à 5% du chiffre d affaires)</li><li>Retrait d autorisation</li><li>Emprisonnement possible (violation grave)</li></ul><h3>Rôles</h3><ul><li><strong>Responsable de traitement</strong> — décide du traitement (ex : la banque)</li><li><strong>Sous-traitant</strong> — traite pour le compte (ex : prestataire cloud)</li><li><strong>DPO</strong> (Data Protection Officer) — délégué à la protection</li><li><strong>ARTCI</strong> — autorité de contrôle</li></ul><h3>Cas bancaire</h3><ul><li>Ouverture de compte = collecte de données</li><li>KYC (Know Your Customer) = obligatoire</li><li>Conservation des données = 5 à 10 ans (obligation légale)</li><li>Fuite = notification ARTCI + BCEAO + clients</li></ul><div class=\"box\">La loi 2013-450 = la loi informatique et libertés ivoirienne. Elle protège les personnes, pas les entreprises.</div><div class=\"bank\">Une banque qui fuit les données clients doit notifier ARTCI + BCEAO + CNIL + clients. Amendes massives.</div><div class=\"warn\">Collecter plus de données que nécessaire = violation de la proportionnalité. Un DPO doit surveiller.</div>",
cas:"<h3>Cas 1 — Registre de traitement</h3><p>Obligatoire pour chaque traitement :</p><ul><li>Nom du traitement (ex : ouverture de compte)</li><li>Finalité</li><li>Base légale</li><li>Données collectées</li><li>Durée de conservation</li><li>Destinataires</li><li>Mesures de sécurité</li></ul><h3>Cas 2 — Demande d accès</h3><p>Un client demande ses données. Délai légal : 1 mois. Contenu : toutes les données + finalité + destinataires. Refus possible dans certains cas (intérêt public, sécurité nationale).</p><h3>Cas 3 — Fuite de données</h3><ol><li>Détecter la fuite</li><li>Contenir (isoler systèmes)</li><li>Évaluer l ampleur (nombre de personnes affectées)</li><li>Notifier ARTCI sous 72h</li><li>Notifier les personnes concernées si risque élevé</li><li>Documenter</li></ol>",
quiz:[
{q:'Loi CI protection données ?',o:['Loi 2013-450','RGPD','CCPA','Aucune'],c:0,e:'2013-450.'},
{q:'Autorité de contrôle CI ?',o:['ARTCI','BCEAO','CNIL','Google'],c:0,e:'ARTCI.'}
]},

{id:5, titre:"ISO 27001 et gouvernance SSI", intro:"ISO 27001 est LA norme internationale de management de la sécurité. Comprendre sa structure est essentiel.",
cours:"<h3>Qu est-ce que ISO 27001</h3><p><strong>ISO/IEC 27001</strong> = norme internationale pour un Système de Management de la Sécurité de l Information (SMSI). Elle définit comment organiser la sécurité, pas comment la mettre en œuvre techniquement.</p><h3>Structure (PDCA)</h3><ul><li><strong>Plan</strong> — définir la politique, les risques</li><li><strong>Do</strong> — mettre en œuvre</li><li><strong>Check</strong> — auditer, mesurer</li><li><strong>Act</strong> — améliorer</li></ul><h3>Annexe A — 93 contrôles</h3><ul><li>A.5 — Politiques SSI</li><li>A.6 — Organisation</li><li>A.7 — Ressources humaines</li><li>A.8 — Gestion des actifs</li><li>A.9 — Contrôle d accès</li><li>A.10 — Cryptographie</li><li>A.11 — Sécurité physique</li><li>A.12 — Sécurité opérationnelle</li><li>A.13 — Communications</li><li>A.14 — Acquisition/développement</li><li>A.15 — Relations fournisseurs</li><li>A.16 — Incidents</li><li>A.17 — Continuité</li><li>A.18 — Conformité</li></ul><h3>Mise en œuvre en banque</h3><ul><li><strong>Politique SSI</strong> validée par la direction</li><li><strong>Analyse de risques</strong> (EBIOS RM, ISO 27005)</li><li><strong>Déclaration d applicabilité</strong> (SoA) — quels contrôles on applique</li><li><strong>Audit interne</strong> annuel</li><li><strong>Revue de direction</strong> annuelle</li><li><strong>Certification</strong> par organisme accrédité</li></ul><h3>Certifications complémentaires</h3><ul><li><strong>ISO 27017</strong> — sécurité cloud</li><li><strong>ISO 27018</strong> — données personnelles cloud</li><li><strong>ISO 27032</strong> — cybersécurité</li><li><strong>ISO 22301</strong> — continuité d activité</li></ul><h3>Avantages</h3><ul><li>Confiance clients</li><li>Conformité réglementaire</li><li>Réduction des risques</li><li>Image de marque</li><li>Avantage concurrentiel</li></ul><div class=\"box\">ISO 27001 = la certification qui dit « nous avons un système de sécurité organisé ». Ce n est pas un label technique mais managérial.</div><div class=\"bank\">Banques : ISO 27001 + PCI-DSS + BCEAO = trio gagnant de la conformité.</div><div class=\"warn\">ISO 27001 mal mise en œuvre = classeur qui dort. La valeur est dans l application quotidienne.</div>",
cas:"<h3>Cas 1 — Analyse de risques EBIOS RM</h3><ol><li>Cadrage et socle</li><li>Sources de risque</li><li>Scénarios stratégiques</li><li>Scénarios opérationnels</li><li>Traitement du risque</li></ol><h3>Cas 2 — Politique SSI</h3><ul><li>Engagement de la direction</li><li>Objectifs de sécurité</li><li>Rôles et responsabilités</li><li>Règles d usage</li><li>Sanctions en cas de violation</li><li>Révision annuelle</li></ul><h3>Cas 3 — SoA (Statement of Applicability)</h3><p>Tableau listant les 93 contrôles avec :</p><ul><li>Applicable ou non</li><li>Justification</li><li>État de mise en œuvre</li><li>Responsable</li></ul>",
quiz:[
{q:'ISO 27001 = ?',o:['Norme SMSI','Antivirus','Firewall','VPN'],c:0,e:'SMSI.'},
{q:'EBIOS RM ?',o:['Analyse risques','Antivirus','Chiffrement','Cloud'],c:0,e:'Risques.'}
]},

{id:6, titre:"Gestion des risques cyber", intro:"Identifier, évaluer, traiter les risques : c est le cœur du métier de RSSI. Sans méthode, on gère dans le brouillard.",
cours:"<h3>Qu est-ce qu un risque</h3><p><strong>Risque</strong> = combinaison d une <strong>menace</strong> (qui), d une <strong>vulnérabilité</strong> (faiblesse) et d un <strong>impact</strong> (conséquence).</p><h3>Formule</h3><p><code>Risque = Probabilité × Impact</code></p><h3>Sources de risque</h3><ul><li><strong>Humaines internes</strong> — employé malveillant, erreur</li><li><strong>Humaines externes</strong> — hacker, concurrent</li><li><strong>Environnementales</strong> — incendie, inondation</li><li><strong>Techniques</strong> — panne, bug</li></ul><h3>Méthodes</h3><ul><li><strong>EBIOS RM</strong> — ANSSI, référence française</li><li><strong>ISO 27005</strong> — internationale</li><li><strong>NIST RMF</strong> — américaine</li><li><strong>MEHARI</strong> — CLUSIF</li><li><strong>OCTAVE</strong> — SEI</li></ul><h3>Traitement du risque</h3><ul><li><strong>Réduire</strong> — mettre en place un contrôle (pare-feu, chiffrement)</li><li><strong>Accepter</strong> — le risque est faible ou l impact acceptable</li><li><strong>Transférer</strong> — assurance cyber</li><li><strong>Éviter</strong> — arrêter l activité risquée</li></ul><h3>Matrice de risque</h3><table><tr><th>Impact / Probabilité</th><th>Faible</th><th>Moyen</th><th>Fort</th></tr><tr><td>Fort</td><td>Moyen</td><td>Élevé</td><td>Critique</td></tr><tr><td>Moyen</td><td>Faible</td><td>Moyen</td><td>Élevé</td></tr><tr><td>Faible</td><td>Négligeable</td><td>Faible</td><td>Moyen</td></tr></table><h3>Risques bancaires typiques</h3><ul><li>Fraude interne</li><li>Phishing clients</li><li>Ransomware</li><li>Compromission SWIFT</li><li>Fuite de données</li><li>Indisponibilité du core banking</li><li>Déni de service sur les paiements</li></ul><div class=\"box\">Gérer le risque = prévoir le pire et décider à l avance de ce qu on fait. Pas de surprise.</div><div class=\"bank\">Chaque banque doit avoir une cartographie des risques SI validée par la direction et auditée annuellement.</div><div class=\"warn\">Un risque non identifié est un risque NON géré. Documenter TOUS les risques, même les plus improbables.</div>",
cas:"<h3>Cas 1 — Cartographie des risques</h3><table><tr><th>Risque</th><th>Probabilité</th><th>Impact</th><th>Niveau</th></tr><tr><td>Phishing clients</td><td>Fort</td><td>Moyen</td><td>Élevé</td></tr><tr><td>Ransomware</td><td>Moyen</td><td>Fort</td><td>Élevé</td></tr><tr><td>Fuite SWIFT</td><td>Faible</td><td>Fort</td><td>Élevé</td></tr><tr><td>DDoS paiements</td><td>Moyen</td><td>Moyen</td><td>Moyen</td></tr><tr><td>Erreur admin</td><td>Fort</td><td>Faible</td><td>Faible</td></tr></table><h3>Cas 2 — Plan de traitement</h3><p>Pour chaque risque élevé :</p><ul><li>Contrôle à mettre en place (ex : MFA)</li><li>Responsable (ex : DSI)</li><li>Budget</li><li>Délai</li><li>Indicateur de suivi</li></ul><h3>Cas 3 — Assurance cyber</h3><p>Transférer les risques résiduels via une assurance cyber : couvre les frais de restauration, rançon, pertes d exploitation, frais juridiques.</p>",
quiz:[
{q:'Risque = ?',o:['Probabilité × Impact','Antivirus','Firewall','VPN'],c:0,e:'Probabilité × impact.'},
{q:'EBIOS RM ?',o:['Méthode risques','Antivirus','Cloud','Firewall'],c:0,e:'ANSSI.'}
]},

{id:7, titre:"Lutte anti-blanchiment (LAB/CFT) et fraude", intro:"La lutte contre le blanchiment est LA priorité des régulateurs bancaires. La cyber et la LAB sont liées.",
cours:"<h3>Qu est-ce que le blanchiment</h3><p><strong>Blanchiment</strong> = processus visant à rendre légale de l argent d origine criminelle. En 3 étapes :</p><ol><li><strong>Placement</strong> — injecter l argent sale dans le système</li><li><strong>Empilement</strong> — multiplier les transactions pour brouiller les traces</li><li><strong>Intégration</strong> — récupérer l argent blanchi</li></ol><h3>Les 3 volets</h3><ul><li><strong>LAB</strong> — Lutte Anti-Blanchiment</li><li><strong>CFT</strong> — Combating the Financing of Terrorism</li><li><strong>Sanctions internationales</strong> — gel des avoirs</li></ul><h3>Obligations bancaires</h3><ul><li><strong>KYC</strong> (Know Your Customer) — vérifier l identité</li><li><strong>KYB</strong> (Know Your Business) — vérifier les entreprises</li><li><strong>Surveillance des transactions</strong> — détecter anomalies</li><li><strong>Déclaration de soupçon</strong> — CENTIF</li><li><strong>Gel des avoirs</strong> — personnes sanctionnées</li><li><strong>Formation</strong> — personnel sensibilisé</li></ul><h3>Autorités</h3><ul><li><strong>CENTIF</strong> — Cellule Nationale de Traitement des Informations Financières (Côte d Ivoire)</li><li><strong>GIABA</strong> — Afrique de l Ouest</li><li><strong>GAFI</strong> — international</li></ul><h3>Fraude bancaire typique</h3><ul><li><strong>Fraude interne</strong> — employé détourne</li><li><strong>Phishing</strong> — identifiants volés</li><li><strong>Fraude au président</strong> — faux ordre d un dirigeant</li><li><strong>Fraude CB</strong> — carding, skimming</li><li><strong>Fraude mobile money</strong> — SIM swap, phishing SMS</li></ul><h3>Lien cyber-LAB</h3><ul><li>Un compte compromis peut servir au blanchiment</li><li>Les cybercriminels blanchissent via crypto et mobile money</li><li>Les outils SOC aident à détecter les fraudes</li><li>Les logs sont des preuves en cas d enquête</li></ul><div class=\"box\">La LAB n est pas qu une affaire de compliance : c est aussi un métier de data analystes et d enquêteurs.</div><div class=\"bank\">Chaque banque a un service LAB/Compliance indépendant du business. Toute déclaration de soupçon est confidentielle.</div><div class=\"warn\">Ne PAS déclarer un soupçon = délit pénal pour le banquier. Amende personnelle possible.</div>",
cas:"<h3>Cas 1 — Détecter une fraude</h3><ul><li>Transactions atypiques (montants, horaires)</li><li>Comptes dormant réactivés</li><li>Virements vers pays à risque</li><li>Nombreuses transactions fractionnées</li><li>Same IP, différents comptes</li></ul><h3>Cas 2 — Déclaration de soupçon</h3><ol><li>Détecter un comportement suspect</li><li>Documenter (logs, transactions)</li><li>Remonter au compliance officer</li><li>Décision de déclarer ou non</li><li>Transmission à CENTIF</li><li>Confidentialité absolue</li></ol><h3>Cas 3 — Fraude au président</h3><p>Un attaquant se fait passer pour le DG par email. Demande un virement urgent et confidentiel.</p><p>Détection : vérifier l adresse email, appeler le DG, vérifier les procédures.</p>",
quiz:[
{q:'KYC = ?',o:['Know Your Customer','Antivirus','Firewall','Cloud'],c:0,e:'Connaissance client.'},
{q:'Déclaration soupçon ?',o:['CENTIF','Google','Microsoft','AWS'],c:0,e:'CENTIF.'}
]},

{id:8, titre:"Sécurité du mobile money", intro:"Le mobile money est massif en Afrique. Orange Money, MTN MoMo, Wave... Comprendre leur sécurité est devenu essentiel.",
cours:"<h3>Le mobile money en Côte d Ivoire</h3><table><tr><th>Service</th><th>Opérateur</th><th>Utilisateurs</th></tr><tr><td>Orange Money</td><td>Orange CI</td><td>Millions</td></tr><tr><td>MTN MoMo</td><td>MTN CI</td><td>Millions</td></tr><tr><td>Moov Money</td><td>Moov Africa</td><td>Millions</td></tr><tr><td>Wave</td><td>Wave Mobile</td><td>Croissance rapide</td></tr></table><h3>Comment ça marche</h3><ol><li>Client ouvre compte (KYC simplifié)</li><li>Dépôt cash → crédit compte mobile</li><li>Transfert entre comptes</li><li>Retrait cash via agent</li></ol><h3>Régulation</h3><ul><li>BCEAO — instruction 008-2018 sur établissements de paiement</li><li>ARTCI — télécoms</li><li>Obligations LAB/CFT renforcées</li><li>Plafonds de transaction</li></ul><h3>Failles de sécurité typiques</h3><ul><li><strong>SIM swap</strong> — attaquant obtient une nouvelle SIM au nom de la victime</li><li><strong>Phishing SMS</strong> — faux message demande les identifiants</li><li><strong>USSD spoofing</strong> — réception d appels frauduleux</li><li><strong>Compromission agent</strong> — agent malhonnête</li><li><strong>API mobile mal sécurisée</strong> — interception, replay</li><li><strong>Malware mobile</strong> — app bancaire trojanisée</li></ul><h3>Protection</h3><ul><li><strong>Double authentification</strong> — code PIN + OTP</li><li><strong>Cryptographie</strong> — TLS sur l API</li><li><strong>Chiffrement local</strong> — données app</li><li><strong>Anti-tampering</strong> — détecter le root</li><li><strong>Biométrie</strong> — empreinte, face</li><li><strong>Détection SIM swap</strong> — alerter sur changement SIM</li><li><strong>Limites de transaction</strong></li></ul><div class=\"box\">Le mobile money est une banque dans votre poche. Sa sécurité dépend autant de l opérateur que de vous (ne pas cliquer sur les SMS louches).</div><div class=\"bank\">Le mobile money est LE canal de paiement en croissance en CI. La sécuriser est une priorité BCEAO.</div><div class=\"warn\">Un SIM swap peut vider un compte en 5 minutes. Activer la double authentification est vital.</div>",
cas:"<h3>Cas 1 — SIM swap</h3><ol><li>Attaquant obtient les infos personnelles de la victime</li><li>Se fait passer pour elle auprès de l opérateur</li><li>Obtient une nouvelle SIM au nom de la victime</li><li>Reçoit les OTP à sa place</li><li>Vide le compte mobile money</li></ol><p>Protection : MFA biométrique, alerte changement SIM, code secret opérateur.</p><h3>Cas 2 — Phishing SMS</h3><p>« Votre compte est suspendu, cliquez ici pour réactiver : bit.ly/xxxxx »</p><p>Détection : URL suspecte, pas le vrai domaine, urgence anormale.</p><h3>Cas 3 — Sécurité API</h3><pre>GET /api/balance\nAuthorization: Bearer eyJhbGc...\n\n# Vérifications côté serveur\n- Token valide et non expiré\n- Device fingerprint\n- Rate limiting\n- Logs de toutes les requêtes</pre>",
quiz:[

{id:9, titre:"Audit et contrôle interne SI", intro:"L audit interne vérifie que les contrôles fonctionnent. C est la clé de la conformité durable.",
cours:"<h3>Qu est-ce que l audit</h3><p><strong>Audit</strong> = processus indépendant et objectif d évaluation des contrôles, processus et systèmes pour vérifier leur conformité aux normes et leur efficacité.</p><h3>Types d audit</h3><ul><li><strong>Audit interne</strong> — réalisé par la banque elle-même</li><li><strong>Audit externe</strong> — cabinet indépendant</li><li><strong>Audit réglementaire</strong> — par la BCEAO ou mandaté</li><li><strong>Audit de certification</strong> — ISO, PCI-DSS</li></ul><h3>Normes d audit</h3><ul><li><strong>ISA</strong> — International Standards on Auditing</li><li><strong>IIA</strong> — Institute of Internal Auditors</li><li><strong>COBIT</strong> — gouvernance IT</li><li><strong>ISO 19011</strong> — audit de systèmes de management</li></ul><h3>Phases d un audit</h3><ol><li>Planification (objectifs, périmètre)</li><li>Collecte d informations (interviews, docs)</li><li>Tests de contrôle (vérifier l efficacité)</li><li>Analyse et conclusions</li><li>Rapport d audit</li><li>Suivi des recommandations</li></ol><h3>Contrôles typiques SI</h3><ul><li>Gestion des accès (IAM)</li><li>Gestion des changements</li><li>Sauvegardes et restauration</li><li>Surveillance des logs</li><li>Gestion des incidents</li><li>Sécurité physique (datacenter)</li><li>Formation utilisateurs</li></ul><h3>Rapport d audit</h3><ul><li>Contexte et périmètre</li><li>Méthodologie</li><li>Constats (findings)</li><li>Recommandations</li><li>Plan d action</li><li>Conclusion</li></ul><h3>Suivi</h3><p>Chaque recommandation doit être :</p><ul><li>Suivie par un responsable désigné</li><li>Datée (échéance)</li><li>Vérifiée</li><li>Documentée</li></ul><div class=\"box\">Un audit n est pas une attaque contre les équipes, c est une amélioration continue. Un bon auditeur est un partenaire.</div><div class=\"bank\">Les banques ont un département d audit interne (conformité) + audit externe + audit BCEAO. Un triple niveau.</div><div class=\"warn\">Une recommandation d audit non suivie peut coûter la licence bancaire. La direction est responsable.</div>",
cas:"<h3>Cas 1 — Audit d accès</h3><ul><li>Lister les comptes admin</li><li>Vérifier la séparation des rôles</li><li>Contrôler les revues d accès trimestrielles</li><li>Détecter les comptes orphelins</li><li>Vérifier la MFA sur tous les comptes sensibles</li></ul><h3>Cas 2 — Audit de sauvegarde</h3><ul><li>Vérifier la fréquence</li><li>Tester la restauration</li><li>Vérifier le chiffrement</li><li>Vérifier la copie hors site</li><li>Documenter les tests</li></ul><h3>Cas 3 — Rapport type</h3><p>Exemple finding :</p><ul><li>Constat : les mots de passe administrateurs ne sont pas renouvelés tous les 90 jours</li><li>Risque : compromission prolongée non détectée</li><li>Recommandation : appliquer une rotation automatique</li><li>Responsable : DSI</li><li>Échéance : 60 jours</li><li>Criticité : élevée</li></ul>",
quiz:[
{q:'Audit ?',o:['Vérifier conformité','Attaquer','Chiffrer','Firewall'],c:0,e:'Conformité.'},
{q:'Suivi reco ?',o:['Responsable + échéance','Rien','Facultatif','Reporté'],c:0,e:'Responsable.'}
]},

{id:10, titre:"PCA, réponse à incident et synthèse", intro:"Le plan de continuité et la réponse à incident sont l assurance-vie d une banque. Synthèse du parcours complet.",
cours:"<h3>PCA / PRA</h3><ul><li><strong>PCA</strong> (Plan de Continuité d Activité) — maintenir les activités en cas de sinistre</li><li><strong>PRA</strong> (Plan de Reprise d Activité) — redémarrer les systèmes après un sinistre</li><li><strong>PCI</strong> (Plan de Continuité Informatique) — spécifique IT</li></ul><h3>Objectifs</h3><ul><li><strong>RTO</strong> (Recovery Time Objective) — temps max d interruption</li><li><strong>RPO</strong> (Recovery Point Objective) — perte de données max</li></ul><p>Banque : RTO &lt; 4h, RPO &lt; 15 min pour les systèmes critiques.</p><h3>Composants d un PCA</h3><ul><li>Analyse d impact sur l activité (BIA)</li><li>Scénarios de sinistre</li><li>Procédures de crise</li><li>Cellule de crise</li><li>Site de repli</li><li>Tests annuels</li></ul><h3>Réponse à incident</h3><ol><li><strong>Détection</strong> — SIEM, EDR, alertes</li><li><strong>Qualification</strong> — vrai incident ?</li><li><strong>Confinement</strong> — isoler sans détruire les preuves</li><li><strong>Éradication</strong> — supprimer la menace</li><li><strong>Rétablissement</strong> — restaurer</li><li><strong>Leçons apprises</strong> — post-mortem</li><li><strong>Notification</strong> — BCEAO, ARTCI, clients</li></ol><h3>Cellule de crise</h3><ul><li>RSSI — pilote</li><li>DSI — technique</li><li>DG — décision</li><li>Communication — presse</li><li>Juridique — aspects légaux</li><li>RH — si interne</li></ul><h3>Synthèse du parcours</h3><table><tr><th>Niveau</th><th>Compétence clé</th></tr><tr><td>1</td><td>Fondamentaux IT</td></tr><tr><td>2</td><td>Réseaux</td></tr><tr><td>3</td><td>Linux/Windows</td></tr><tr><td>4</td><td>Cryptographie</td></tr><tr><td>5</td><td>Sécurité Web</td></tr><tr><td>6</td><td>Pentest</td></tr><tr><td>7</td><td>Analyse malware</td></tr><tr><td>8</td><td>Forensics</td></tr><tr><td>9</td><td>Cloud/DevSecOps</td></tr><tr><td>10</td><td>Bancaire/Conformité</td></tr></table><div class=\"box\">Le PCA = le parachute d une banque. On espère ne jamais s en servir. Mais on prie pour qu il soit bien plié le jour J.</div><div class=\"bank\">BCEAO impose un PCA testé annuellement. Une banque sans PCA valide peut perdre sa licence.</div><div class=\"warn\">Un incident non notifié à la BCEAO sous 72h = amende automatique. Toujours notifier, même en cas de doute.</div><div class=\"good\">🎓 Tu as terminé les 10 niveaux ! Ton parcours est complet. Tu as les bases pour débuter en cyber bancaire en Côte d Ivoire.</div>",
cas:"<h3>Cas 1 — PCA bancaire</h3><ol><li>BIA — quels systèmes critiques ?</li><li>RTO/RPO pour chaque système</li><li>Site de repli (data center secondaire)</li><li>Procédures de basculement</li><li>Cellule de crise (noms, contacts)</li><li>Tests annuels documentés</li></ol><h3>Cas 2 — Incident ransomware</h3><ol><li>Détection : alerte EDR</li><li>Isolation : couper le réseau</li><li>Analyse : forensics</li><li>Éradication : supprimer le malware</li><li>Rétablissement : restaurer depuis backup</li><li>Notification : BCEAO, ARTCI, clients</li><li>Leçons apprises : renforcer</li></ol><h3>Cas 3 — Simulation de crise</h3><p>Faire un exercice annuel :</p><ul><li>Scénario : ransomware sur le core banking</li><li>Acteurs : RSSI, DSI, DG, communication</li><li>Objectif : tester le PCA</li><li>Durée : 4h</li><li>Livrable : rapport d exercice</li></ul>",
quiz:[
{q:'PCA ?',o:['Plan Continuité Activité','Antivirus','Chiffrement','Cloud'],c:0,e:'Continuité.'},
{q:'RTO ?',o:['Temps max interruption','Antivirus','Firewall','Cloud'],c:0,e:'Recovery Time.'}
]}

function validerQuiz(id) {
  var d = null;
  for (var i = 0; i < DEFIS.length; i++) { if (DEFIS[i].id === id) { d = DEFIS[i]; break; } }
  if (!d) return;
  var correct = 0;
  for (var qi = 0; qi < d.quiz.length; qi++) {
    var q = d.quiz[qi];
    var sel = document.querySelector('input[name="q' + qi + '"]:checked');
    var labels = document.querySelectorAll('.q[data-i="' + qi + '"] label');
    for (var li = 0; li < labels.length; li++) { labels[li].classList.remove('ok','ko'); }
    var e = document.getElementById('exp' + qi); if (e) e.style.display = 'block';
    if (sel && parseInt(sel.value) === q.c) { correct++; labels[q.c].classList.add('ok'); }
    else { labels[q.c].classList.add('ok'); if (sel) labels[parseInt(sel.value)].classList.add('ko'); }
  }
  var u = user();
  if (correct === d.quiz.length) {
    var k = '10_' + id;
    if (!u.done[k]) {
      u.done[k] = true;
      var t = today();
      if (!u.jours[t]) u.jours[t] = [];
      if (u.jours[t].indexOf(k) === -1) u.jours[t].push(k);
    }
  }
  save();
  var r = document.getElementById('qr');
  var pass = correct === d.quiz.length;
  r.className = 'res ' + (pass ? 'g' : 'r');
  r.textContent = pass ? '🎉 ' + correct + '/' + d.quiz.length + ' — Défi validé !' : correct + '/' + d.quiz.length + ' — Réessaie';
  if (pass && id === 10 && isComplete(10)) {
    setTimeout(function(){ alert('🏆 FÉLICITATIONS !\n\nTu as terminé le parcours complet des 10 niveaux !\n\nTu as maintenant toutes les bases pour débuter en cybersécurité bancaire en Côte d Ivoire.'); }, 400);
  }
}

    html += '<div class="cert"><div class="seal">🎓</div><div class="sub">Certificat final — Parcours complet</div><div class="title">Cybersécurité Bancaire · Côte d Ivoire</div><p style="color:#94a3b8;margin:12px 0;font-size:.9rem">Décerné à</p><div class="name">' + u.name + '</div><p style="color:#94a3b8;max-width:540px;margin:12px auto;font-size:.88rem">Pour avoir complété les 10 niveaux du parcours Mon Drôle Parcours Cyber : fondamentaux, réseaux, Linux/Windows, cryptographie, sécurité web, pentest, analyse malware, forensics, cloud et bancaire.</p><div class="details"><div>Niveaux<strong>10/10</strong></div><div>Partiel<strong>' + (u.examens['10_partiel'] ? '✅' : '—') + '</strong></div><div>Final<strong>' + (u.examens['10_final'] ? '✅' : '—') + '</strong></div><div>Date<strong>' + new Date().toLocaleDateString('fr-FR') + '</strong></div></div><div class="id">ID : ' + certId + '</div><div class="sig"><div class="sig-block"><div class="sig-name">H. N\'GUESSAN</div><div class="sig-line">Fondateur</div></div><div class="sig-block"><div class="sig-name" style="font-family:Georgia,serif">' + new Date().toLocaleDateString('fr-FR') + '</div><div class="sig-line">Date</div></div></div></div>';
    html += '<div class="nav" style="justify-content:center;margin-top:14px"><button onclick="window.print()">🖨️ PDF</button><button class="gold" onclick="go(\'cv\')">📄 CV</button></div>';
  }
  html += '</div>';
  document.getElementById('app').innerHTML = html;
}

function renderCV() {
  var u = user(); if (!u) return;
  var badges = '';
  for (var i = 0; i < u.certs.length; i++) {
    for (var j = 0; j < CERTS.length; j++) {
      if (CERTS[j].id === u.certs[i]) { badges += '<span class="badge">' + CERTS[j].nom + '</span>'; break; }
    }
  }
  if (!badges) badges = '<span style="color:#94a3b8;font-size:.85rem;font-style:italic">Aucune certification.</span>';
  var defis = '';
  for (var i = 0; i < DEFIS.length; i++) {
    defis += '<li>' + (u.done['10_' + DEFIS[i].id] ? '✓' : '○') + ' ' + DEFIS[i].titre + '</li>';
  }
  var html = '<div class="card" style="background:none;border:none;padding:0">';
  html += '<div class="nav" style="margin-bottom:14px"><button onclick="window.print()">🖨️ PDF</button><button class="sec" onclick="copyCV()">📋 Copier</button></div>';
  html += '<div class="cv-box"><h1>' + u.name.toUpperCase() + '</h1><div class="role">Étudiant L2 UVCI — Aspirant Analyste Cyber en Banque CI</div>';
  html += '<h2>Formation</h2><ul><li>Licence 2 — UVCI (Sciences informatiques)</li><li>Mon Drôle Parcours Cyber N1 → N10 (parcours complet)</li></ul>';
  html += '<h2>Compétences</h2><ul><li>Conformité bancaire (BCEAO, PCI-DSS, ISO 27001)</li><li>Loi ivoirienne 2013-450 (protection données)</li><li>Gestion des risques (EBIOS RM)</li><li>LAB/CFT, KYC, CENTIF</li><li>Sécurité mobile money</li><li>Audit et contrôle interne SI</li><li>PCA et réponse à incident</li><li>Cybersécurité technique (réseaux, Linux, pentest, forensics, cloud)</li></ul>';
  html += '<h2>Défis N10 validés</h2><ul>' + defis + '</ul>';
  html += '<h2>Certifications</h2><div>' + badges + '</div>';
  html += '<p style="margin-top:20px;font-size:.72rem;color:#94a3b8;text-align:center;border-top:1px solid #e2e8f0;padding-top:12px">Généré le ' + new Date().toLocaleDateString('fr-FR') + ' · H. N\'GUESSAN ®</p></div></div>';
  document.getElementById('app').innerHTML = html;
}

function copyCV() {
  var u = user(); if (!u) return;
  var t = u.name.toUpperCase() + '\nÉtudiant L2 UVCI — Aspirant Analyste Cyber en Banque CI\n\nParcours Cyber N1 à N10 (complet)\n\nCompétences : BCEAO, PCI-DSS, ISO 27001, LAB/CFT, mobile money, audit, PCA, cybersécurité technique\n\nGénéré le ' + new Date().toLocaleDateString('fr-FR');
  if (navigator.clipboard) { navigator.clipboard.writeText(t).then(function(){ alert('CV copié !'); }, function(){ fbCopy(t); }); } else fbCopy(t);
}
function fbCopy(t) { var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); alert('CV copié !'); } catch (e) { alert('Copie manuelle'); } document.body.removeChild(ta); }

function renderStats() {
  var u = user(); if (!u) return;
  var t = today();
  var tt = u.jours[t] || [];
  var html = '<div class="card"><h2>📊 Statistiques — Parcours complet</h2><div class="stats-grid">';
  html += '<div class="stat"><span class="big">' + countDone(1) + '</span><span class="lbl">N1</span></div>';
  html += '<div class="stat"><span class="big">' + countDone(2) + '</span><span class="lbl">N2</span></div>';
  html += '<div class="stat"><span class="big">' + countDone(3) + '</span><span class="lbl">N3</span></div>';
  html += '<div class="stat"><span class="big">' + countDone(4) + '</span><span class="lbl">N4</span></div>';
  html += '<div class="stat"><span class="big">' + countDone(5) + '</span><span class="lbl">N5</span></div>';
  html += '<div class="stat"><span class="big">' + countDone(6) + '</span><span class="lbl">N6</span></div>';
  html += '<div class="stat"><span class="big">' + countDone(7) + '</span><span class="lbl">N7</span></div>';
  html += '<div class="stat"><span class="big">' + countDone(8) + '</span><span class="lbl">N8</span></div>';
  html += '<div class="stat"><span class="big">' + countDone(9) + '</span><span class="lbl">N9</span></div>';
  html += '<div class="stat"><span class="big">' + countDone(10) + '</span><span class="lbl">N10</span></div>';
  html += '</div></div>';
  html += '<div class="card"><h3>🔥 Aujourd hui</h3>';
  if (tt.length === 0) html += '<p style="color:#94a3b8">Aucun défi.</p>';
  else { html += '<ul class="today">'; for (var i = 0; i < tt.length; i++) { html += '<li>✅ ' + tt[i] + '</li>'; } html += '</ul>'; }
  html += '</div>';
  document.getElementById('app').innerHTML = html;
}

function renderJobs() {
  var html = '<div class="card"><h2>💼 Offres banque CI</h2><div class="jobs-grid">';
  for (var i = 0; i < JOBS.length; i++) {
    var j = JOBS[i];
    html += '<div class="job"><h4>' + j.t + '</h4><div class="org">' + j.o + ' · ' + j.l + '</div><p>' + j.d + '</p><a href="' + j.u + '" target="_blank">Voir ↗</a></div>';
  }
  html += '</div></div>';
  document.getElementById('app').innerHTML = html;
}

function renderCerts() {
  var u = user();
  var html = '<div class="card"><h2>🎓 Certifications bancaires</h2><div class="tabs">';
  html += '<div class="tab active" onclick="filterCerts(this,\'all\')">Toutes</div>';
  html += '<div class="tab" onclick="filterCerts(this,\'free\')">Gratuites</div>';
  html += '<div class="tab" onclick="filterCerts(this,\'paid\')">Payantes</div>';
  html += '<div class="tab" onclick="filterCerts(this,\'done\')">Obtenues</div>';
  html += '</div><div class="certs-grid">';
  for (var i = 0; i < CERTS.length; i++) {
    var c = CERTS[i];
    var isD = u.certs.indexOf(c.id) !== -1;
    html += '<div class="cert-item ' + (c.free ? 'free' : 'paid') + ' ' + (isD ? 'done' : '') + '" data-t="' + (c.free ? 'free' : 'paid') + '" data-d="' + (isD ? '1' : '0') + '">';
    html += '<h4>' + c.nom + '</h4><div class="org">' + c.org + '</div>';
    html += '<div><span class="tag ' + (c.free ? 'free' : 'paid') + '">' + (c.free ? 'GRATUIT' : c.prix) + '</span><span class="tag lvl">' + c.niv + '</span></div>';
    html += '<p>' + c.desc + '</p><a href="' + c.lien + '" target="_blank">Voir ↗</a>';
    html += ' <button class="sec" style="padding:5px 10px;font-size:.74em" onclick="toggleCert(\'' + c.id + '\')">' + (isD ? '✓' : 'Marquer') + '</button>';
    html += '</div>';
  }
  html += '</div></div>';
  document.getElementById('app').innerHTML = html;
}
function filterCerts(el, type) {
  var tabs = document.querySelectorAll('.tab');
  for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('active');
  el.classList.add('active');
  var items = document.querySelectorAll('.cert-item');
  for (var i = 0; i < items.length; i++) {
    var m = false;
    if (type === 'all') m = true;
    else if (type === 'done') m = items[i].dataset.d === '1';
    else m = items[i].dataset.t === type;
    items[i].style.display = m ? 'block' : 'none';
  }
}
function toggleCert(id) {
  var u = user(); if (!u) return;
  var i = u.certs.indexOf(id);
  if (i === -1) u.certs.push(id); else u.certs.splice(i, 1);
  save(); renderCerts();
}

function renderExamens() {
  var u = user(); if (!u) return;
  var html = '<div class="card"><h2>📝 Examens N10</h2>';
  var types = ['partiel','final'];
  for (var i = 0; i < types.length; i++) {
    var type = types[i];
    var e = EXAMENS[type];
    var passed = u.examens['10_' + type];
    var ready = true;
    for (var j = 0; j < e.req.length; j++) { if (!u.done['10_' + e.req[j]]) { ready = false; break; } }
    var cls = 'exam ' + (passed ? 'passed' : (ready ? '' : 'locked'));
    html += '<div class="' + cls + '"><h4>' + e.titre + '</h4><p style="font-size:.85em;color:#cbd5e1">' + e.desc + '</p>';
    if (passed) html += '<p style="color:#86efac;font-size:.85em">✅ ' + passed + '</p><button class="sec" onclick="go(\'examen/' + type + '\')">Refaire</button>';
    else if (ready) html += '<button class="gold" onclick="go(\'examen/' + type + '\')">Passer</button>';
    else html += '<p style="color:#fbbf24;font-size:.82em">🔒 Défis ' + e.req.join(', ') + '</p>';
    html += '</div>';
  }
  html += '</div>';
  document.getElementById('app').innerHTML = html;
}

function renderExamen(type) {
  var u = user(); if (!u) return;
  var e = EXAMENS[type]; if (!e) { go('examens'); return; }
  var ready = true;
  for (var j = 0; j < e.req.length; j++) { if (!u.done['10_' + e.req[j]]) { ready = false; break; } }
  if (!ready) { alert('Valide les défis requis.'); go('examens'); return; }
  var html = '<div class="card"><h2>' + e.titre + '</h2><p style="color:#94a3b8;font-size:.85em">' + e.desc + '</p><div class="quiz">';
  for (var qi = 0; qi < e.qs.length; qi++) {
    var q = e.qs[qi];
    html += '<div class="q" data-i="' + qi + '"><p>Q' + (qi + 1) + '. ' + q.q + '</p>';
    for (var oi = 0; oi < q.o.length; oi++) {
      html += '<label><input type="radio" name="ex' + qi + '" value="' + oi + '"> ' + q.o[oi] + '</label>';
    }
    html += '<div class="exp" id="exexp' + qi + '">' + q.e + '</div></div>';
  }
  html += '<button onclick="validerExamen(\'' + type + '\')">Soumettre</button><div id="er"></div></div></div>';
  document.getElementById('app').innerHTML = html;
}

function validerExamen(type) {
  var u = user(); if (!u) return;
  var e = EXAMENS[type]; if (!e) return;
  var correct = 0;
  for (var qi = 0; qi < e.qs.length; qi++) {
    var q = e.qs[qi];
    var sel = document.querySelector('input[name="ex' + qi + '"]:checked');
    var labels = document.querySelectorAll('.q[data-i="' + qi + '"] label');
    for (var li = 0; li < labels.length; li++) { labels[li].classList.remove('ok','ko'); }
    var ex = document.getElementById('exexp' + qi); if (ex) ex.style.display = 'block';
    if (sel && parseInt(sel.value) === q.c) { correct++; labels[q.c].classList.add('ok'); }
    else { labels[q.c].classList.add('ok'); if (sel) labels[parseInt(sel.value)].classList.add('ko'); }
  }
  var pct = Math.round(correct / e.qs.length * 100);
  var req = type === 'final' ? 80 : 60;
  var pass = pct >= req;
  if (pass) { u.examens['10_' + type] = today(); save(); }
  var r = document.getElementById('er');
  r.className = 'res ' + (pass ? 'g' : 'r');
  r.textContent = pass ? '🎉 ' + correct + '/' + e.qs.length + ' (' + pct + '%)' : correct + '/' + e.qs.length + ' (' + pct + '%) — Il faut ' + req + '%';
}

function b64(s) { try { return btoa(unescape(encodeURIComponent(s))); } catch(e) { return ''; } }
function unb64(b) { try { return decodeURIComponent(escape(atob(b.replace(/\s/g,'')))); } catch(e) { return null; } }
function exportCode() { return b64(JSON.stringify(state)); }
function importCode(c) { var j = unb64(c.trim()); if (!j) return false; try { var d = JSON.parse(j); if (!d) return false; state = Object.assign({}, state, d); save(); return true; } catch(e) { return false; } }
function dlBackup() { var b = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'}); var url = URL.createObjectURL(b); var a = document.createElement('a'); a.href = url; a.download = 'mdpc-n10-' + today() + '.json'; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); }
function readFile(input) { var f = input.files[0]; if (!f) return; var r = new FileReader(); r.onload = function(e) { try { var d = JSON.parse(e.target.result); state = Object.assign({}, state, d); save(); alert('Restauré !'); route(); } catch(err) { alert('Invalide'); } }; r.readAsText(f); }

function renderSync() {
  var code = exportCode();
  var html = '<div class="card"><h2>🌐 Sync</h2></div>';
  html += '<div class="card"><h3>📋 Code</h3><div class="sync-box"><label>Ton code</label><textarea id="so" readonly onclick="this.select()">' + code + '</textarea><div style="margin-top:8px"><button onclick="copyCode()">Copier</button></div></div>';
  html += '<div class="sync-box"><label>Coller un code</label><textarea id="si" placeholder="Colle ici..."></textarea><div style="margin-top:8px"><button onclick="applyCode()">Restaurer</button></div></div></div>';
  html += '<div class="card"><h3>💾 Fichier</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><button onclick="dlBackup()">Télécharger</button><input type="file" id="bf" accept=".json" style="display:none" onchange="readFile(this)"><button class="sec" onclick="document.getElementById(\'bf\').click()">Importer</button></div></div>';
  document.getElementById('app').innerHTML = html;
}
function copyCode() { var ta = document.getElementById('so'); ta.select(); try { document.execCommand('copy'); alert('Copié !'); } catch(e) { alert('Manuel'); } }
function applyCode() { var c = document.getElementById('si').value; if (!c.trim()) { alert('Colle un code.'); return; } if (importCode(c)) { alert('Restauré !'); route(); } else alert('Code invalide.'); }

function route() {
  try {
    header();
    if (!state.currentUser) { renderLogin(); return; }
    if (!isUnlocked(10)) { renderLocked(); return; }
    var h = (location.hash || '#home').slice(1);
    var p = h.split('/');
    if (p[0] === 'home' || p[0] === '') return renderHome();
    if (p[0] === 'defi' && p[1]) return renderDefi(parseInt(p[1]));
    if (p[0] === 'certif') return renderCertif();
    if (p[0] === 'cv') return renderCV();
    if (p[0] === 'stats') return renderStats();
    if (p[0] === 'jobs') return renderJobs();
    if (p[0] === 'examens') return renderExamens();
    if (p[0] === 'examen' && p[1]) return renderExamen(p[1]);
    if (p[0] === 'certs') return renderCerts();
    if (p[0] === 'sync') return renderSync();
    renderHome();
  } catch(e) {
    console.error('Route error:', e);
    document.getElementById('app').innerHTML = '<div class="card"><h2 style="color:#ef4444">Erreur</h2><p style="color:#ef4444">' + e.message + '</p><pre style="color:#fca5a5;font-size:.8em;white-space:pre-wrap">' + (e.stack || '') + '</pre></div>';
  }
}
window.addEventListener('hashchange', route);
try { route(); } catch(e) {
  document.getElementById('app').innerHTML = '<div class="card"><h2 style="color:#ef4444">Erreur init</h2><p style="color:#ef4444">' + e.message + '</p></div>';
}
</script>
